name: Starter task reply

on:
  issues:
    types:
      - opened

permissions:
  issues: write
  contents: read

jobs:
  reply:
    runs-on: ubuntu-latest
    steps:
      - name: Reply to starter task request
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.issue.labels.map((label) => label.name);
            if (!labels.includes("starter-task")) {
              return;
            }

            const body = [
              "Thanks for sending a starter task brief.",
              "",
              "Please do not pay before the scope is confirmed.",
              "",
              "Useful links:",
              "",
              "- Service page: https://didixyy.github.io/remote-freelancer-first-sale-kit/",
              "- Samples: https://didixyy.github.io/remote-freelancer-first-sale-kit/samples.html",
              "- Free CSV cleanup tool: https://didixyy.github.io/remote-freelancer-first-sale-kit/csv-cleaner.html",
              "- Free spreadsheet sample: https://didixyy.github.io/remote-freelancer-first-sale-kit/assets/free-spreadsheet-cleanup-sample.xlsx",
              "- Payment after scope confirmation: https://paypal.me/yp1233/10USD",
              "",
              "Scope reminder: the 10 USD starter task is for one narrow task. It is not accounting, tax, legal, investment, research, data-verification, or guaranteed-income advice.",
              "",
              "Please keep private credentials, bank details, and payment card data out of the issue."
            ].join("\\n");

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body
            });
