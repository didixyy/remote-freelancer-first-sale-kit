name: Starter task reply

on:
  issues:
    types:
      - opened

permissions:
  issues: write
  contents: read

jobs:
  reply:
    runs-on: ubuntu-latest
    steps:
      - name: Reply to starter task request
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.issue.labels.map((label) => label.name);
            const isCsvCleanup = labels.includes("csv-cleanup");
            const isStarterTask = labels.includes("starter-task");

            if (!isCsvCleanup && !isStarterTask) {
              return;
            }

            const extractIssueFormValue = (body, fieldName) => {
              const escapedFieldName = fieldName.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
              const pattern = new RegExp(`### ${escapedFieldName}\\n\\n([\\s\\S]*?)(?=\\n\\n### |$)`, "i");
              const match = body.match(pattern);
              return match ? match[1].trim() : "";
            };

            const parsePositiveNumber = (value) => {
              const match = value.match(/\\d+/);
              return match ? Number.parseInt(match[0], 10) : null;
            };

            const issueBody = context.payload.issue.body || "";
            const paymentSenderEmail = extractIssueFormValue(issueBody, "Payment sender email");
            const rowCount = parsePositiveNumber(extractIssueFormValue(issueBody, "Row count"));
            const columnCount = parsePositiveNumber(extractIssueFormValue(issueBody, "Column count"));
            const isPaidBrief = isCsvCleanup && paymentSenderEmail && paymentSenderEmail.toLowerCase() !== "_no response_";
            const isOverLimit = isCsvCleanup && ((rowCount !== null && rowCount > 300) || (columnCount !== null && columnCount > 12));

            const csvCleanupBody = [
              "CSV cleanup request received.",
              "",
              "Fixed-scope check:",
              "",
              "- One CSV or Excel file.",
              "- Up to 300 rows and 12 columns.",
              "- Visible cleanup only: readable labels, spacing cleanup, obvious duplicate review, and a short change note.",
              "- Not accounting, tax, legal, investment, audit, import troubleshooting, or data-verification work.",
              "",
              "Useful links:",
              "",
              "- Product CSV cleanup: https://didixyy.github.io/remote-freelancer-first-sale-kit/product-csv-cleanup.html",
              "- Order export CSV cleanup: https://didixyy.github.io/remote-freelancer-first-sale-kit/order-export-csv-cleanup.html",
              "- Invoice and contact CSV cleanup: https://didixyy.github.io/remote-freelancer-first-sale-kit/invoice-contact-csv-cleanup.html",
              "- General spreadsheet cleanup: https://didixyy.github.io/remote-freelancer-first-sale-kit/spreadsheet-cleanup-service.html",
              "- 10 USD CSV scope checker: https://didixyy.github.io/remote-freelancer-first-sale-kit/scope-checker.html",
              "- Sample CSV cleanup delivery: https://didixyy.github.io/remote-freelancer-first-sale-kit/csv-cleanup-delivery-example.html",
              "- Sample delivery release package: https://github.com/didixyy/remote-freelancer-first-sale-kit/releases/tag/csv-cleanup-delivery-example-v1",
              "- Payment after fixed scope is confirmed: https://paypal.me/yp1233/10USD",
              "",
              "If you already paid, make sure the request includes the Payment sender email so the payment can be matched to the task.",
              "",
              "Please keep private credentials, bank details, and payment card data out of the issue."
            ].join("\\n");

            const csvFollowUps = [];
            const labelsToAdd = [];

            if (isPaidBrief) {
              labelsToAdd.push("paid-brief");
              csvFollowUps.push(
                "",
                "Payment matching note:",
                "",
                "The request includes a Payment sender email. Please keep the issue open until the payment is visible in PayPal and matched manually."
              );
            }

            if (isOverLimit) {
              labelsToAdd.push("over-limit");
              csvFollowUps.push(
                "",
                "This request appears to be over the fixed 10 USD scope.",
                "",
                "Please wait for scope confirmation before paying or sending more files."
              );
            }

            const starterTaskBody = [
              "Thanks for sending a starter task brief.",
              "",
              "Please do not pay before the scope is confirmed.",
              "",
              "Useful links:",
              "",
              "- Service page: https://didixyy.github.io/remote-freelancer-first-sale-kit/",
              "- Spreadsheet cleanup service: https://didixyy.github.io/remote-freelancer-first-sale-kit/spreadsheet-cleanup-service.html",
              "- Samples: https://didixyy.github.io/remote-freelancer-first-sale-kit/samples.html",
              "- Free CSV cleanup tool: https://didixyy.github.io/remote-freelancer-first-sale-kit/csv-cleaner.html",
              "- 10 USD CSV scope checker: https://didixyy.github.io/remote-freelancer-first-sale-kit/scope-checker.html",
              "- Sample CSV cleanup delivery: https://didixyy.github.io/remote-freelancer-first-sale-kit/csv-cleanup-delivery-example.html",
              "- Sample delivery release package: https://github.com/didixyy/remote-freelancer-first-sale-kit/releases/tag/csv-cleanup-delivery-example-v1",
              "- Free spreadsheet sample: https://didixyy.github.io/remote-freelancer-first-sale-kit/assets/free-spreadsheet-cleanup-sample.xlsx",
              "- Payment after scope confirmation: https://paypal.me/yp1233/10USD",
              "",
              "Scope reminder: the 10 USD starter task is for one narrow task. It is not accounting, tax, legal, investment, research, data-verification, or guaranteed-income advice.",
              "",
              "Please keep private credentials, bank details, and payment card data out of the issue."
            ].join("\\n");

            const body = isCsvCleanup ? `${csvCleanupBody}${csvFollowUps.join("\\n")}` : starterTaskBody;

            if (labelsToAdd.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                labels: labelsToAdd
              });
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body
            });
